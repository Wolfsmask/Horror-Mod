name: Client start

# Starts the real game client for each ported version under a virtual display and software
# rendering. Versions with Fabric's client test API run the full client game test (photographs
# and all); the older ones, which have no such API, are started, left on the first screen long
# enough to draw it many times, and checked for a crash. Results go to tools/ports/<mc>-client.txt.
on:
  workflow_dispatch:
  push:
    paths:
      - 'versions/**'
      - 'src/client/**'
      - 'src/main/**'
      - 'tools/ci/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/client-smoke.yml'

permissions:
  contents: write

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.20.1', '1.21.1', '1.21.11', '26.1.2', '26.3', '26.4-snapshot-2']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Virtual display and software rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers > /dev/null

      - name: Start the client
        id: client
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          chmod +x gradlew
          if grep -q '^exclude_sources=.*client/test' "versions/${{ matrix.mc }}.properties"; then
            # No client test API: started to the first screen, then into a world with it in view.
            tools/ci/client-start.sh ${{ matrix.mc }}
          else
            set -o pipefail
            # If world creation stalls, a thread dump shows where: taken once, 40 s into preparing spawn.
            ( for i in $(seq 1 180); do
                if grep -q "Preparing spawn area" client.log 2>/dev/null; then
                  sleep 40
                  pid=$(pgrep -f "net.fabricmc.devlaunchinjector.Main" | head -n 1)
                  [ -n "$pid" ] && jstack "$pid" > threads.txt 2>&1
                  break
                fi
                sleep 5
              done ) &
            xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGametest -Pmc=${{ matrix.mc }} --console=plain 2>&1 | tee client.log
          fi

      - name: Record the result
        if: always()
        run: |
          OUT="$RUNNER_TEMP/client"
          mkdir -p "$OUT"
          {
            echo "# ${{ matrix.mc }} client on $GITHUB_SHA: ${{ steps.client.outcome }}"
            for log in client.log server.log world.log; do
              [ -f "$log" ] || continue
              echo "=== $log"
              grep -E "\[client\]|\[smoke\]|client-gametest|Exception|Caused by|Crash|FAILED|What went wrong|occupant|Done \(|Stopping" "$log" \
                | grep -vE "DEBUG|Datafixer|flite|OpenAL|Realms|GLX|World loading finished|Reloading ResourceManager" | head -n 60 || true
              echo "--- the mod's own checks, last of them ---"
              grep -E "\(occupant\) \[client-gametest\]|Director error|AssertionError" "$log" | grep -vE "screenshot " | tail -n 30 || true
              echo "--- last of the server thread in $log ---"
              grep -E "Server thread|Worker-Main|Preparing" "$log" | grep -v DEBUG | tail -n 20 || true
              echo "--- tail of $log ---"
              tail -n 25 "$log" || true
            done
            if [ -f threads.txt ] && [ "${{ steps.client.outcome }}" != "success" ]; then
              echo "=== threads 40 s into preparing spawn"
              awk '/^"/{keep = ($0 ~ /Server thread|Worker-Main|Render thread|Test thread|IO-Worker/); n = 0} keep && n < 45 {print; n++}' threads.txt | head -n 400
            fi
          } > "$OUT/result.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p tools/ports
            cp "$OUT/result.txt" "tools/ports/${{ matrix.mc }}-client.txt"
            for shot in shot-*.png; do if [ -f "$shot" ]; then cp "$shot" "tools/ports/${{ matrix.mc }}-${shot#shot-}"; fi; done
            git add -A tools/ports
            git diff --cached --quiet && break
            git commit -q -m "Client start result for ${{ matrix.mc }} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((attempt * 4))
          done
