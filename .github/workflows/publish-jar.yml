name: Publish jar

# Run manually: builds the mod, runs every game test, and only if everything passes,
# commits the jar to dist/ on the same branch so it can be downloaded straight from the repo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Game tests
        run: |
          mkdir -p build/gametest
          echo "eula=true" > build/gametest/eula.txt
          ./gradlew runGametest

      - name: Commit jar to dist/
        run: |
          mkdir -p dist
          rm -f dist/*.jar
          cp build/libs/occupant-*.jar dist/
          rm -f dist/*-sources.jar
          ls -la dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Jar unchanged."
          else
            git commit -m "Add tested mod jar [skip ci]"
            git push
          fi
