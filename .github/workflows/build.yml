name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Show latest Fabric versions for 1.21.1 (informational)
        continue-on-error: true
        run: |
          echo "Loader:"; curl -fsS "https://meta.fabricmc.net/v2/versions/loader/1.21.1" | grep -o '"version": *"[^"]*"' | head -3 || true
          echo "Yarn:"; curl -fsS "https://meta.fabricmc.net/v2/versions/yarn/1.21.1" | grep -o '"version": *"[^"]*"' | head -3 || true
          echo "Fabric API:"; curl -fsS "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" | grep -o '<version>[^<]*+1\.21\.1</version>' | tail -3 || true

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Run game tests (headless server)
        run: |
          mkdir -p build/gametest
          echo "eula=true" > build/gametest/eula.txt
          ./gradlew runGametest --stacktrace

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occupant-mod
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload game test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: |
            build/gametest/junit.xml
            build/gametest/logs/latest.log
          if-no-files-found: ignore
