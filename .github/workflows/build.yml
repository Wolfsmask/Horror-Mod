name: Build & Test

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'tools/api-probe/**'
      - 'tools/marketing/**'
      - 'tools/ports/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Show latest Fabric versions for 26.2 (informational)
        continue-on-error: true
        run: |
          echo "Loader:"; curl -fsS "https://meta.fabricmc.net/v2/versions/loader/26.2" | grep -o '"version": *"[^"]*"' | head -3 || true
          echo "Game:"; curl -fsS "https://meta.fabricmc.net/v2/versions/game" | grep -o '"version": *"[^"]*"' | head -3 || true
          echo "Fabric API:"; curl -fsS "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" | grep -o '<version>[^<]*+26\.2</version>' | tail -3 || true

      # The model is generated, so it can drift from its generator, and geometry faults (a bone
      # the Java asks for that no longer exists, two surfaces in the same plane) do not show up
      # in a compile or in a headless test. They only show up in front of a player.
      - name: Check the model
        run: |
          python3 -m pip install --quiet numpy pillow
          python3 tools/check_model.py
          python3 tools/generate_model.py
          git diff --exit-code -- src/client/java/com/wolfsmask/occupant/client/render/OccupantGeometry.java \
            src/main/resources/assets/occupant/textures/entity \
            || { echo "::error::The committed model does not match tools/generate_model.py. Run it and commit."; exit 1; }

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      # Compile errors are buried in the middle of a very long log, so they are written to a
      # file and committed: reading them back out of the workflow log is unreliable.
      - name: Commit compile errors
        if: failure()
        run: |
          {
            echo "# Build failed at $(date -u +%FT%TZ) on $GITHUB_SHA"
            grep -E "\.java:[0-9]+: (error|warning):|^e: |^error: |symbol:|location:|required:|found:|reason:" build.log | head -n 120
            echo "--- tail ---"
            tail -n 40 build.log
          } > tools/api-probe/build-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/api-probe/build-errors.txt
          git commit -m "Build errors [skip ci]" || true
          # Someone may have pushed while this ran: rebase onto them rather than fail.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((attempt * 3))
          done

      - name: Run game tests (headless server)
        run: |
          mkdir -p build/gametest
          echo "eula=true" > build/gametest/eula.txt
          ./gradlew runGametest || {
            echo "::group::Server log (last 150 lines)"
            tail -n 150 build/gametest/logs/latest.log || true
            echo "::endgroup::"
            exit 1
          }

      - name: Game test summary
        if: always()
        run: |
          grep -E "\[gametest\]|GAME TESTS COMPLETE|required tests|test.* failed|Event '.*' failed" build/gametest/logs/latest.log | tail -n 40 || true

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occupant-mod
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload game test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: |
            build/gametest/junit.xml
            build/gametest/logs/latest.log
          if-no-files-found: ignore

  # Boots the actual game client. The headless server tests above cannot show that the model
  # renders, that the entity reaches a client, or that a player can get into a world at all.
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Virtual display and software rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          xvfb-run -a glxinfo -B | grep -E "OpenGL (renderer|core profile version)" || true

      - name: Run the client game test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          chmod +x gradlew
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGametest --console=plain 2>&1 | tee client.log

      # Also kept with the run, whichever commit is newest by the time it finishes.
      - name: Upload the photographs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-photographs
          path: build/clientGametest/occupant-shots/*.png
          if-no-files-found: ignore

      # The screenshots are the point, pass or fail, so they are kept in the repository.
      - name: Commit screenshots and the outcome
        if: always()
        run: |
          OUT="$RUNNER_TEMP/client-test"
          mkdir -p "$OUT"
          # The test files a copy of each photograph under its own name; fall back to a search.
          cp build/clientGametest/occupant-shots/*.png "$OUT"/ 2>/dev/null \
            || find build/clientGametest -iname "*occupant*.png" -exec cp {} "$OUT"/ \; || true
          find build/clientGametest -iname "*.png" | head -n 40 > "$OUT/files.txt" || true
          {
            echo "# Client game test on $GITHUB_SHA ($(date -u +%FT%TZ)): ${{ job.status }}"
            grep -E "client-gametest|Exception|Error|AssertionError|FAILED|Occupant|occupant" client.log | grep -v "DEBUG" | head -n 120
            echo "--- tail ---"
            tail -n 60 client.log
          } > "$OUT/result.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each attempt starts again from the branch as it is now, so two runs finishing together
          # can never conflict over the same images. If newer code has been pushed since this run
          # started, its own run will report, and this one's results are already out of date.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            if [ -n "$(git log --format=%s "${GITHUB_SHA}..origin/${GITHUB_REF_NAME}" | grep -v '\[skip ci\]')" ]; then
              echo "Newer code is on the branch; leaving the report to its run."
              break
            fi
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            rm -rf docs/client-test
            mkdir -p docs/client-test
            cp -r "$OUT"/. docs/client-test/
            git add -A -f docs/client-test
            git diff --cached --quiet && break
            git commit -q -m "Client game test results [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((attempt * 3))
          done

  # The client again, with Sodium, which most players have: Sodium draws the land itself, with its
  # own copy of the fog, and that copy must be this mod's fog. The latest Sodium for the version is
  # fetched from Modrinth; if there is none, there is nothing to check.
  sodium:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3', '1.21.11']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Virtual display and software rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers > /dev/null

      - name: Fetch Sodium
        id: fetch
        run: |
          api="https://api.modrinth.com/v2/project/sodium/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22${{ matrix.mc }}%22%5D"
          read -r version url < <(curl -fsS "$api" | python3 -c "import json,sys; d=json.load(sys.stdin); v=d[0] if d else None; f=v and next((f for f in v['files'] if f.get('primary')), v['files'][0]); print((v['version_number'] + ' ' + f['url']) if v else '- -')")
          echo "Sodium for ${{ matrix.mc }}: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$url" != "-" ]; then
            mkdir -p build/clientGametest/mods
            curl -fsSL "$url" -o build/clientGametest/mods/sodium.jar
          fi

      - name: Run the client with Sodium
        id: run
        if: steps.fetch.outputs.version != '-'
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          JAVA_TOOL_OPTIONS: "-Doccupant.sodium=true"
        run: |
          chmod +x gradlew
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGametest -Pmc=${{ matrix.mc }} --console=plain 2>&1 | tee sodium.log

      - name: Record the result
        if: always()
        run: |
          OUT="$RUNNER_TEMP/sodium.txt"
          {
            echo "# ${{ matrix.mc }} with Sodium ${{ steps.fetch.outputs.version }} on $GITHUB_SHA: ${{ steps.run.outcome }}"
            grep -E "\[sodium\]|AssertionError|Exception|Caused by|Crash|FAILED|Mixin|mixin" sodium.log 2>/dev/null | grep -v DEBUG | head -n 60
            echo "--- tail ---"
            tail -n 40 sodium.log 2>/dev/null
          } > "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p tools/ports
            cp "$OUT" "tools/ports/sodium-${{ matrix.mc }}.txt"
            git add -f "tools/ports/sodium-${{ matrix.mc }}.txt"
            git diff --cached --quiet && break
            git commit -q -m "Sodium result for ${{ matrix.mc }} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((attempt * 3))
          done

      - name: Fail if the fog did not reach Sodium
        if: steps.run.outcome == 'failure'
        run: exit 1
