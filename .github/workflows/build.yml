name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Show latest Fabric versions for 26.2 (informational)
        continue-on-error: true
        run: |
          echo "Loader:"; curl -fsS "https://meta.fabricmc.net/v2/versions/loader/26.2" | grep -o '"version": *"[^"]*"' | head -3 || true
          echo "Game:"; curl -fsS "https://meta.fabricmc.net/v2/versions/game" | grep -o '"version": *"[^"]*"' | head -3 || true
          echo "Fabric API:"; curl -fsS "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" | grep -o '<version>[^<]*+26\.2</version>' | tail -3 || true

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      # Compile errors are buried in the middle of a very long log, so they are written to a
      # file and committed: reading them back out of the workflow log is unreliable.
      - name: Commit compile errors
        if: failure()
        run: |
          {
            echo "# Build failed at $(date -u +%FT%TZ) on $GITHUB_SHA"
            grep -E "\.java:[0-9]+: (error|warning):|^e: |^error: |symbol:|location:|required:|found:|reason:" build.log | head -n 120
            echo "--- tail ---"
            tail -n 40 build.log
          } > tools/api-probe/build-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/api-probe/build-errors.txt
          git commit -m "Build errors [skip ci]" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true

      - name: Run game tests (headless server)
        run: |
          mkdir -p build/gametest
          echo "eula=true" > build/gametest/eula.txt
          ./gradlew runGametest || {
            echo "::group::Server log (last 150 lines)"
            tail -n 150 build/gametest/logs/latest.log || true
            echo "::endgroup::"
            exit 1
          }

      - name: Game test summary
        if: always()
        run: |
          grep -E "\[gametest\]|GAME TESTS COMPLETE|required tests|test.* failed|Event '.*' failed" build/gametest/logs/latest.log | tail -n 40 || true

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occupant-mod
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload game test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: |
            build/gametest/junit.xml
            build/gametest/logs/latest.log
          if-no-files-found: ignore
