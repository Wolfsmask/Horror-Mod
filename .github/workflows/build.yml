name: Build & Test

on:
  push:
    paths-ignore:
      - 'dist/**'
      - 'tools/api-probe/**'
  pull_request:
  workflow_dispatch:
    inputs:
      tape:
        description: "Scenes of the long video to record, as [tape:a,b] ([keep] to keep the last run's)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Show latest Fabric versions for 26.2 (informational)
        continue-on-error: true
        run: |
          echo "Loader:"; curl -fsS "https://meta.fabricmc.net/v2/versions/loader/26.2" | grep -o '"version": *"[^"]*"' | head -3 || true
          echo "Game:"; curl -fsS "https://meta.fabricmc.net/v2/versions/game" | grep -o '"version": *"[^"]*"' | head -3 || true
          echo "Fabric API:"; curl -fsS "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" | grep -o '<version>[^<]*+26\.2</version>' | tail -3 || true

      # The model is generated, so it can drift from its generator, and geometry faults (a bone
      # the Java asks for that no longer exists, two surfaces in the same plane) do not show up
      # in a compile or in a headless test. They only show up in front of a player.
      - name: Check the model
        run: |
          python3 -m pip install --quiet numpy pillow
          python3 tools/check_model.py
          python3 tools/generate_model.py
          git diff --exit-code -- src/client/java/com/wolfsmask/occupant/client/render/OccupantGeometry.java \
            || { echo "::error::The committed model does not match tools/generate_model.py. Run it and commit."; exit 1; }
          python3 tools/ci/compare-textures.py \
            || { echo "::error::The committed texture does not match tools/generate_model.py. Run it and commit."; exit 1; }

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      # Compile errors are buried in the middle of a very long log, so they are written to a
      # file and committed: reading them back out of the workflow log is unreliable.
      - name: Commit compile errors
        if: failure()
        run: |
          {
            echo "# Build failed at $(date -u +%FT%TZ) on $GITHUB_SHA"
            grep -E "\.java:[0-9]+: (error|warning):|^e: |^error: |symbol:|location:|required:|found:|reason:" build.log | head -n 120
            echo "--- tail ---"
            tail -n 40 build.log
          } > "$RUNNER_TEMP/build-errors.txt"
          bash tools/ci/save-results.sh "Build errors" build "$RUNNER_TEMP/build-errors.txt"

      - name: Run game tests (headless server)
        run: |
          mkdir -p build/gametest
          echo "eula=true" > build/gametest/eula.txt
          ./gradlew runGametest || {
            echo "::group::Server log (last 150 lines)"
            tail -n 150 build/gametest/logs/latest.log || true
            echo "::endgroup::"
            exit 1
          }

      - name: Game test summary
        if: always()
        run: |
          grep -E "\[gametest\]|GAME TESTS COMPLETE|required tests|test.* failed|Event '.*' failed" build/gametest/logs/latest.log | tail -n 40 || true

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occupant-mod
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload game test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: |
            build/gametest/junit.xml
            build/gametest/logs/latest.log
          if-no-files-found: ignore

  # Boots the actual game client. The headless server tests above cannot show that the model
  # renders, that the entity reaches a client, or that a player can get into a world at all.
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Virtual display and software rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          xvfb-run -a glxinfo -B | grep -E "OpenGL (renderer|core profile version)" || true

      # Footage for a short video, instead of the photographs, for a commit marked [reel]; or for
      # the long one, the scenes a run is asked for ([tape:...]), which the test reads from the flag.
      - name: Ask for the reel
        if: contains(github.event.head_commit.message, '[reel]') || inputs.tape != ''
        env:
          ASKED: ${{ inputs.tape || github.event.head_commit.message }}
        run: mkdir -p build/clientGametest && printf '%s\n' "$ASKED" > build/clientGametest/reel.flag

      - name: Run the client game test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          chmod +x gradlew
          set -o pipefail
          # Tall enough for the reel's upright window as well as the photographs' wide one.
          xvfb-run -a -s "-screen 0 1920x1920x24" ./gradlew runClientGametest --console=plain 2>&1 | tee client.log

      # Each clip of the reel, a frame a tick, made a video.
      - name: Make the reel's clips
        if: always()
        env:
          ASKED: ${{ inputs.tape || github.event.head_commit.message }}
        run: |
          REEL=build/clientGametest/occupant-reel
          if [ -d "$REEL" ]; then
            sudo apt-get install -y -qq ffmpeg > /dev/null
            OUT="$RUNNER_TEMP/reel"
            mkdir -p "$OUT"
            for d in "$REEL"/*/; do
              n=$(basename "$d")
              ls "$d" | head -n 1 > /dev/null || continue
              # The long video's clips say how small to keep them.
              CRF=$(cat "$d/crf" 2>/dev/null || echo 10)
              PAT="%04d.png"
              [ -e "$d/0000.jpg" ] && PAT="%04d.jpg"
              ffmpeg -y -loglevel error -framerate 20 -i "$d/$PAT" -c:v libx264 -preset slow -crf "$CRF" -pix_fmt yuv420p "$OUT/$n.mp4" \
                && echo "$n: $(ls "$d" | wc -l) frames" || echo "$n: not made"
              # What is heard when, and how far the camera tips, for the edit.
              cp "$d/marks.txt" "$OUT/$n.txt" 2>/dev/null || true
              cp "$d/roll.txt" "$OUT/$n.roll" 2>/dev/null || true
            done
            # The game's own sounds for the edit (cave ambience, a pick on stone, steps), from the
            # assets the test downloaded.
            IDX=$(ls -t $(find ~/.gradle "$GITHUB_WORKSPACE/.gradle" -path '*assets/indexes/*.json' 2>/dev/null) 2>/dev/null | head -n 1)
            if [ -n "$IDX" ]; then
              python3 - "$IDX" "$OUT/sounds" <<'PY' || true
          import json, os, shutil, sys
          idx, out = sys.argv[1], sys.argv[2]
          objs = os.path.join(os.path.dirname(os.path.dirname(idx)), "objects")
          for key, v in json.load(open(idx))["objects"].items():
              if key.startswith(("minecraft/sounds/ambient/", "minecraft/sounds/dig/", "minecraft/sounds/step/",
                                 "minecraft/sounds/random/door", "minecraft/sounds/random/chest", "minecraft/sounds/random/glass",
                                 "minecraft/sounds/block/wooden_door/", "minecraft/sounds/block/chest/",
                                 "minecraft/sounds/block/barrel/", "minecraft/sounds/block/campfire/", "minecraft/sounds/fire/",
                                 "minecraft/sounds/item/shovel/", "minecraft/sounds/mob/cow/", "minecraft/sounds/mob/sheep/",
                                 "minecraft/sounds/mob/pig/", "minecraft/sounds/mob/chicken/")):
                  src = os.path.join(objs, v["hash"][:2], v["hash"])
                  if os.path.exists(src):
                      dst = os.path.join(out, key[len("minecraft/sounds/"):])
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copy(src, dst)
          print("sounds:", sum(len(f) for _, _, f in os.walk(out)))
          PY
            fi
            ls -la "$OUT"
            # Two runs of the long video at once each keep the other's clips.
            CLEAR=1
            case "$ASKED" in *"[keep]"*) CLEAR=0 ;; esac
            CLEAR=$CLEAR bash tools/ci/save-results.sh "Reel" reel "$OUT/."
          fi

      # Also kept with the run, whichever commit is newest by the time it finishes.
      - name: Upload the photographs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-photographs
          path: build/clientGametest/occupant-shots/*.png
          if-no-files-found: ignore

      # The screenshots are the point, pass or fail, so they are kept in the repository.
      - name: Commit screenshots and the outcome
        if: always()
        run: |
          OUT="$RUNNER_TEMP/client-test"
          mkdir -p "$OUT"
          # The test files a copy of each photograph under its own name; fall back to a search.
          cp build/clientGametest/occupant-shots/*.png "$OUT"/ 2>/dev/null \
            || find build/clientGametest -iname "*occupant*.png" -exec cp {} "$OUT"/ \; || true
          find build/clientGametest -iname "*.png" | head -n 40 > "$OUT/files.txt" || true
          {
            echo "# Client game test on $GITHUB_SHA ($(date -u +%FT%TZ)): ${{ job.status }}"
            # Not the compiler's deprecation warnings, which name the mod's own files and would fill it.
            grep -E "client-gametest|Exception|Error|AssertionError|FAILED|Occupant|occupant|fell |died|was slain|was killed|drowned|burned|suffocated|starved" client.log \
              | grep -v "DEBUG" | grep -v "warning: \[" | head -n 300
            echo "--- tail ---"
            tail -n 60 client.log
          } > "$OUT/result.txt"
          # If newer code has been pushed since this run started, its own run will report, and
          # this one's results are already out of date. (Jars and probe requests do not count.)
          git fetch -q origin "${GITHUB_REF_NAME}"
          if [ -n "$(git diff --name-only "${GITHUB_SHA}" "origin/${GITHUB_REF_NAME}" -- . ':(exclude)dist' ':(exclude)tools/api-probe')" ]; then
            echo "Newer code is on the branch; leaving the report to its run."
          else
            CLEAR=1 bash tools/ci/save-results.sh "Client game test results" client-test "$OUT/."
          fi

  # The client again, with Sodium, which most players have: Sodium draws the land itself, with its
  # own copy of the fog, and that copy must be this mod's fog. The latest Sodium for the version is
  # fetched from Modrinth; if there is none, there is nothing to check.
  sodium:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3', '1.21.11']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Virtual display and software rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers > /dev/null

      - name: Fetch Sodium
        id: fetch
        run: |
          api="https://api.modrinth.com/v2/project/sodium/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22${{ matrix.mc }}%22%5D"
          read -r version url < <(curl -fsS "$api" | python3 -c "import json,sys; d=json.load(sys.stdin); v=d[0] if d else None; f=v and next((f for f in v['files'] if f.get('primary')), v['files'][0]); print((v['version_number'] + ' ' + f['url']) if v else '- -')")
          echo "Sodium for ${{ matrix.mc }}: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$url" != "-" ]; then
            mkdir -p build/clientGametest/mods
            curl -fsSL "$url" -o build/clientGametest/mods/sodium.jar
          fi

      - name: Run the client with Sodium
        id: run
        if: steps.fetch.outputs.version != '-'
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          JAVA_TOOL_OPTIONS: "-Doccupant.sodium=true"
        run: |
          chmod +x gradlew
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGametest -Pmc=${{ matrix.mc }} --console=plain 2>&1 | tee sodium.log

      - name: Record the result
        if: always()
        run: |
          OUT="$RUNNER_TEMP/sodium.txt"
          {
            echo "# ${{ matrix.mc }} with Sodium ${{ steps.fetch.outputs.version }} on $GITHUB_SHA: ${{ steps.run.outcome }}"
            grep -E "\[sodium\]|AssertionError|Exception|Caused by|Crash|FAILED|Mixin|mixin" sodium.log 2>/dev/null | grep -v DEBUG | head -n 60
            echo "--- tail ---"
            tail -n 40 sodium.log 2>/dev/null
          } > "$OUT"
          cp "$OUT" "$RUNNER_TEMP/sodium-${{ matrix.mc }}.txt"
          bash tools/ci/save-results.sh "Sodium result for ${{ matrix.mc }}" ports "$RUNNER_TEMP/sodium-${{ matrix.mc }}.txt"

      - name: Fail if the fog did not reach Sodium
        if: steps.run.outcome == 'failure'
        run: exit 1
