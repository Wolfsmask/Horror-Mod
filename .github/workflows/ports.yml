name: Ports

# Builds the mod for every Minecraft version in versions/, runs the game tests where it builds,
# and records the result for each: the log in ports/<version>.txt on the ci-results branch, and a
# tested jar in dist/ on this branch when everything passes. Nothing else is put on this branch.
on:
  workflow_dispatch:
  push:
    paths:
      - 'versions/**'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/ports.yml'

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.20.1', '1.21.1', '1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build for ${{ matrix.mc }}
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build -Pmc=${{ matrix.mc }} --console=plain 2>&1 | tee build.log

      - name: Check the jar players get
        id: jar
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bash tools/ci/check-jar.sh ${{ matrix.mc }} 2>&1 | tee jar.log

      - name: Game tests for ${{ matrix.mc }}
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p build/gametest
          echo "eula=true" > build/gametest/eula.txt
          set -o pipefail
          ./gradlew runGametest -Pmc=${{ matrix.mc }} --console=plain 2>&1 | tee test.log

      - name: Record the result
        if: always()
        run: |
          OUT="$RUNNER_TEMP/port"
          mkdir -p "$OUT"
          {
            echo "# ${{ matrix.mc }} on $GITHUB_SHA: build ${{ steps.build.outcome }}, tests ${{ steps.tests.outcome }}, jar ${{ steps.jar.outcome }}"
            # Each compiler error with its "symbol:" / "location:" lines, once (Gradle repeats them).
            awk '/What went wrong/{exit} /error:/{print; n=6; next} n>0 {n--; if (/symbol:|location:|required:|found:|reason:/) print}' build.log \
              | sed -E 's#^.*/(build/versioned|src)/[a-z]+/(java/)?##' | head -n 1200 || true
            grep -E "What went wrong|Could not|^> " build.log | head -n 20 || true
            if [ -f jar.log ]; then echo "=== jar"; tail -n 25 jar.log; fi
            if [ -f test.log ]; then
              grep -E "GAME TESTS COMPLETE|required tests failed|  - occupant|\[gametest\]" test.log | head -n 30
              # The tests never got going: why.
              if ! grep -q "GAME TESTS COMPLETE" test.log; then
                echo "=== the game tests never finished"
                grep -E "Exception|Caused by|Couldn't|Failed to|failed to" test.log | head -n 30 || true
              fi
            fi
          } > "$OUT/result.txt"
          if [ "${{ steps.tests.outcome }}" = "success" ] && [ "${{ steps.jar.outcome }}" = "success" ]; then
            cp build/libs/occupant-*.jar "$OUT/" 2>/dev/null || true
            rm -f "$OUT"/*-sources.jar
          fi
          cp "$OUT/result.txt" "$RUNNER_TEMP/${{ matrix.mc }}.txt"
          bash tools/ci/save-results.sh "Port result for ${{ matrix.mc }}" ports "$RUNNER_TEMP/${{ matrix.mc }}.txt"
          # The download itself: the only thing CI ever puts on this branch.
          if ls "$OUT"/*.jar >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for attempt in 1 2 3 4 5 6; do
              git fetch -q origin "${GITHUB_REF_NAME}"
              git reset -q --hard "origin/${GITHUB_REF_NAME}"
              mkdir -p dist
              rm -f dist/occupant-*+mc${{ matrix.mc }}.jar
              cp "$OUT"/*.jar dist/
              git add -A dist
              git diff --cached --quiet && break
              git commit -q -m "Jar for ${{ matrix.mc }} [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((attempt * 4))
            done
          fi
