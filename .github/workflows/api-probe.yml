name: API probe

# Prints real method signatures from the Minecraft/Fabric jars the mod builds against, for every
# version named on the "@mc" line of tools/api-probe/classes.txt, into out-<version>.txt.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/api-probe/**'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(grep -m1 '^@mc ' tools/api-probe/classes.txt | cut -d' ' -f2- || true)
          [ -z "$V" ] && V=26.2
          echo "versions=$(printf '%s\n' $V | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')" >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve classpath
        run: |
          chmod +x gradlew
          ./gradlew --quiet -Pmc=${{ matrix.mc }} --init-script tools/api-probe/classpath.init.gradle printProbeClasspath | grep '^PROBE_CP=' | head -1 | cut -d= -f2- > cp.txt
          tr ':' '\n' < cp.txt | grep -iE 'minecraft|fabric-api|gametest|rendering|networking' | head -40
      - name: Probe
        run: tools/api-probe/probe.sh "$(cat cp.txt)" | tee tools/api-probe/out-${{ matrix.mc }}.txt
      # Committed rather than only logged: the log tail is unreliable to read back.
      - name: Commit the output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/api-probe/out-${{ matrix.mc }}.txt
          git diff --cached --quiet || git commit -m "API probe output for ${{ matrix.mc }} [skip ci]"
          # Someone may have pushed while this ran: rebase onto them rather than fail.
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((attempt * 4))
          done
