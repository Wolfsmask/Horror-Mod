name: API probe

# Prints real method signatures from the Minecraft/Fabric jars the mod builds against, for every
# version named on the "@mc" line of tools/api-probe/classes.txt, into api-probe/out-<version>.txt
# on the ci-results branch.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/api-probe/**'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(grep -m1 '^@mc ' tools/api-probe/classes.txt | cut -d' ' -f2- || true)
          [ -z "$V" ] && V=26.2
          echo "versions=$(printf '%s\n' $V | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')" >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve classpath
        run: |
          chmod +x gradlew
          ./gradlew --quiet -Pmc=${{ matrix.mc }} --init-script tools/api-probe/classpath.init.gradle printProbeClasspath | grep '^PROBE_CP=' | head -1 | cut -d= -f2- > cp.txt
          tr ':' '\n' < cp.txt | grep -iE 'minecraft|fabric-api|gametest|rendering|networking' | head -40
      - name: Probe
        run: tools/api-probe/probe.sh "$(cat cp.txt)" | tee "$RUNNER_TEMP/out-${{ matrix.mc }}.txt"
      # Saved rather than only logged: the log is not readable from where the probes are asked for.
      - name: Save the output
        run: bash tools/ci/save-results.sh "API probe output for ${{ matrix.mc }}" api-probe "$RUNNER_TEMP/out-${{ matrix.mc }}.txt"
