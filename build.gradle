plugins {
	// Two flavours of Loom: one for the unobfuscated 26.x releases, and the remapping one for the
	// obfuscated versions before them. Which is applied depends on the version being built.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'fabric-loom' version "${loom_version}" apply false
}

// One mod, built for several Minecraft versions: -Pmc=26.3 reads versions/26.3.properties, and
// any file under versions/26.3/<sourceSet>/ replaces the file of the same path in src/<sourceSet>/java.
def mc = project.findProperty("mc") ?: "26.2"
def versionProps = new Properties()
def versionFile = file("versions/${mc}.properties")
if (versionFile.exists()) versionFile.withInputStream { versionProps.load(it) }
versionProps.each { k, v -> project.ext.set(k, v) }
if (!project.hasProperty("minecraft_dep")) project.ext.set("minecraft_dep", "~${project.minecraft_version}")
def obfuscated = versionProps.getProperty("mappings") == "mojang"
apply plugin: obfuscated ? 'fabric-loom' : 'net.fabricmc.fabric-loom'

// 26.x is unobfuscated and needs Java 25; older versions use Mojang's mappings and an older Java.
def javaRelease = (versionProps.getProperty("java_release") ?: "25") as int
project.ext.set("java_dep", ">=${javaRelease}")

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	// Client-only code lives in src/client so a dedicated server can never load it.
	splitEnvironmentSourceSets()

	mods {
		"occupant" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Headless server that runs every game test and exits (used by CI).
		gametest {
			server()
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
			runDir "build/gametest"
		}

		// The real client, with a real renderer, driven by OccupantClientGameTest: joins a world,
		// photographs every pose, rejoins a world it left asleep in, then exits. CI runs it under
		// a virtual display with software rendering.
		clientGametest {
			client()
			name "Client Game Test"
			vmArg "-Dfabric.client.gametest"
			runDir "build/clientGametest"
		}
	}
}

// Version-specific sources. Two kinds, both under versions/<group>/:
//  - <sourceSet>/...: whole files that replace the file of the same path in src/<sourceSet>/java;
//  - replace.txt: "old -> new" lines, plain text renames applied (in order) to every source file,
//    for versions where the only difference is what something is called. A line starting
//    "regex " is a regular expression instead, with $1 and so on in the replacement.
// "overrides" may name several groups, most specific first (1.20.1,1.21.1): a file in an earlier
// group wins, and the renames of the later, more general groups are applied first.
def groups = versionProps.getProperty('overrides', mc).split(',').collect { it.trim() }.findAll { it }
// Source paths (Ant patterns, comma separated) left out entirely, for things a version cannot have.
def dropped = (versionProps.getProperty('exclude_sources') ?: '').split(',').collect { it.trim() }.findAll { it }
def renameFiles = groups.reverse().collect { file("versions/${it}/replace.txt") }.findAll { it.exists() }
def renames = renameFiles.collectMany { it.readLines() }.findAll { it.contains(' -> ') && !it.startsWith('#') }.collect { line ->
	def regex = line.startsWith('regex ')
	def parts = (regex ? line.substring(6) : line).split(' -> ', 2)
	[parts[0], parts[1], regex]
}
["main", "client"].each { setName ->
	// Every overridden path, and the group directory that provides it.
	def provided = [:]
	groups.each { g ->
		def dir = file("versions/${g}/${setName}")
		if (dir.exists()) dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
			def path = dir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
			if (!provided.containsKey(path)) provided[path] = dir
		}
	}
	def dirs = groups.collect { file("versions/${it}/${setName}") }.findAll { it.exists() }
	if (!renames.isEmpty() || dirs.size() > 1) {
		def out = layout.buildDirectory.dir("versioned/${setName}")
		def task = tasks.register("versionSources${setName.capitalize()}", Sync) {
			from("src/${setName}/java") {
				exclude { e -> provided.containsKey(e.relativePath.pathString) }
				exclude dropped
			}
			dirs.each { dir ->
				from(dir) { exclude { e -> !e.directory && provided[e.relativePath.pathString] != dir } }
			}
			into out
			renameFiles.each { inputs.file it }
			filteringCharset = 'UTF-8'
			filter { String line -> renames.inject(line) { l, r -> r[2] ? l.replaceAll(r[0], r[1]) : l.replace(r[0], r[1]) } }
		}
		sourceSets[setName].java.setSrcDirs([task])
	} else {
		dirs.each { dir ->
			sourceSets[setName].java {
				srcDir dir
				exclude { e -> !e.file.toPath().startsWith(dir.toPath()) && provided.containsKey(e.relativePath.pathString) }
			}
		}
		if (!dropped.isEmpty()) sourceSets[setName].java.exclude dropped
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (obfuscated) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
}

processResources {
	def version = project.version
	def minecraftDep = project.minecraft_dep
	def javaDep = project.java_dep
	inputs.property "version", version
	inputs.property "minecraft_dep", minecraftDep
	inputs.property "java_dep", javaDep

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_dep": minecraftDep, "java_dep": javaDep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "1000"]
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}

// Same sources always give the same jar.
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
