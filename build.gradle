plugins {
	// Two flavours of Loom: one for the unobfuscated 26.x releases, and the remapping one for the
	// obfuscated versions before them. Which is applied depends on the version being built.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'fabric-loom' version "${loom_version}" apply false
}

// One mod, built for several Minecraft versions: -Pmc=26.3 reads versions/26.3.properties, and
// any file under versions/26.3/<sourceSet>/ replaces the file of the same path in src/<sourceSet>/java.
def mc = project.findProperty("mc") ?: "26.2"
def versionProps = new Properties()
def versionFile = file("versions/${mc}.properties")
if (versionFile.exists()) versionFile.withInputStream { versionProps.load(it) }
versionProps.each { k, v -> project.ext.set(k, v) }
if (!project.hasProperty("minecraft_dep")) project.ext.set("minecraft_dep", "~${project.minecraft_version}")
def obfuscated = versionProps.getProperty("mappings") == "mojang"
apply plugin: obfuscated ? 'fabric-loom' : 'net.fabricmc.fabric-loom'

// 26.x is unobfuscated and needs Java 25; older versions use Mojang's mappings and an older Java.
def javaRelease = (versionProps.getProperty("java_release") ?: "25") as int
project.ext.set("java_dep", ">=${javaRelease}")

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	// Client-only code lives in src/client so a dedicated server can never load it.
	splitEnvironmentSourceSets()

	mods {
		"occupant" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Headless server that runs every game test and exits (used by CI).
		gametest {
			server()
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
			runDir "build/gametest"
		}

		// The real client, with a real renderer, driven by OccupantClientGameTest: joins a world,
		// photographs every pose, rejoins a world it left asleep in, then exits. CI runs it under
		// a virtual display with software rendering.
		clientGametest {
			client()
			name "Client Game Test"
			vmArg "-Dfabric.client.gametest"
			runDir "build/clientGametest"
		}
	}
}

// Version-specific sources. Two kinds, both under versions/<group>/:
//  - <sourceSet>/...: whole files that replace the file of the same path in src/<sourceSet>/java;
//  - replace.txt: "old -> new" lines, plain text renames applied (in order) to every source file,
//    for versions where the only difference is what something is called.
def group = versionProps.getProperty('overrides', mc)
def renameFile = file("versions/${group}/replace.txt")
def renames = renameFile.exists() ? renameFile.readLines().findAll { it.contains(' -> ') && !it.startsWith('#') }.collect { it.split(' -> ', 2) as List } : []
["main", "client"].each { setName ->
	def overrides = file("versions/${group}/${setName}")
	def replaced = [] as Set
	if (overrides.exists()) {
		overrides.eachFileRecurse(groovy.io.FileType.FILES) { f -> replaced << overrides.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
	}
	if (!renames.isEmpty()) {
		def out = layout.buildDirectory.dir("versioned/${setName}")
		def task = tasks.register("versionSources${setName.capitalize()}", Sync) {
			from("src/${setName}/java") { exclude { e -> replaced.contains(e.relativePath.pathString) } }
			if (overrides.exists()) from(overrides)
			into out
			inputs.file renameFile
			filteringCharset = 'UTF-8'
			filter { String line -> renames.inject(line) { l, r -> l.replace(r[0], r[1]) } }
		}
		sourceSets[setName].java.setSrcDirs([task])
	} else if (overrides.exists()) {
		sourceSets[setName].java {
			srcDir overrides
			exclude { e -> !e.file.toPath().startsWith(overrides.toPath()) && replaced.contains(e.relativePath.pathString) }
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (obfuscated) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
}

processResources {
	def version = project.version
	def minecraftDep = project.minecraft_dep
	def javaDep = project.java_dep
	inputs.property "version", version
	inputs.property "minecraft_dep", minecraftDep
	inputs.property "java_dep", javaDep

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_dep": minecraftDep, "java_dep": javaDep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}

// Same sources always give the same jar.
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
