plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// One mod, built for several Minecraft versions: -Pmc=26.3 reads versions/26.3.properties, and
// any file under versions/26.3/<sourceSet>/ replaces the file of the same path in src/<sourceSet>/java.
def mc = project.findProperty("mc") ?: "26.2"
def versionProps = new Properties()
def versionFile = file("versions/${mc}.properties")
if (versionFile.exists()) versionFile.withInputStream { versionProps.load(it) }
versionProps.each { k, v -> project.ext.set(k, v) }
if (!project.hasProperty("minecraft_dep")) project.ext.set("minecraft_dep", "~${project.minecraft_version}")

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	// Client-only code lives in src/client so a dedicated server can never load it.
	splitEnvironmentSourceSets()

	mods {
		"occupant" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Headless server that runs every game test and exits (used by CI).
		gametest {
			server()
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
			runDir "build/gametest"
		}

		// The real client, with a real renderer, driven by OccupantClientGameTest: joins a world,
		// photographs every pose, rejoins a world it left asleep in, then exits. CI runs it under
		// a virtual display with software rendering.
		clientGametest {
			client()
			name "Client Game Test"
			vmArg "-Dfabric.client.gametest"
			runDir "build/clientGametest"
		}
	}
}

// Version-specific replacements for individual source files.
["main", "client"].each { setName ->
	def overrides = file("versions/${mc}/${setName}")
	if (overrides.exists()) {
		def replaced = [] as Set
		overrides.eachFileRecurse(groovy.io.FileType.FILES) { f -> replaced << overrides.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
		sourceSets[setName].java {
			srcDir overrides
			exclude { e -> !e.file.toPath().startsWith(overrides.toPath()) && replaced.contains(e.relativePath.pathString) }
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	def minecraftDep = project.minecraft_dep
	inputs.property "version", version
	inputs.property "minecraft_dep", minecraftDep

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_dep": minecraftDep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Same sources always give the same jar.
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
